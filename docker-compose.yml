services:
  trainlog:
    build: .
    container_name: trainlog
    depends_on:
      - trainlog_db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - .:/code
    command: [ "--reload", "--workers=1" ]
    env_file:
      - .env
    networks:
      - trainlog

  trainlog_db:
    image: docker.io/postgis/postgis:17-3.5
    container_name: trainlog_db
    restart: unless-stopped
    volumes:
      - db:/var/lib/postgresql/data
      - ./.psqlrc:/root/.psqlrc
    ports:
      - "127.0.0.1:5432:5432"
    env_file:
      - .env
    networks:
      - trainlog

volumes:
  db:

networks:
  trainlog:
    driver: bridge

x-podman:
  in_pod: false
